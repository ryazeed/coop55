    <a class="site-logo" href="index.html"><img data-logo="light" src="assets/img/logo.png" alt="E-COOP" width="95" height="44"><img data-logo="dark" src="assets/img/logo-dark.png" alt="" width="95" height="44"></a>

      <button type="button" class="co-iconbtn app-themebtn app-themebtn--sm" onclick="switchTheme()" title="Switch light / dark mode" data-t-title="theme.toggle"><span class="app-themebtn__moon"><svg class="co-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></span><span class="app-themebtn__sun"><svg class="co-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span></button>
      <button type="button" class="co-btn co-btn--soft co-btn--sm" onclick="switchLanguage()"><svg class="co-ico co-ico--sm" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span data-t="language">العربية</span></button>

<main id="main" class="site-main" tabindex="-1">
<section class="site-wrap narrow">
  <h1 class="section-title section-title--lg" data-t="contact.title">Contact the co-op office</h1>
  <p class="hero__lead" data-t="contact.lead">Questions about E-COOP or a placement? Send us a message and we will reply by email.</p>
  <form class="co-card app-form" id="contact-form" novalidate>
    <div class="row g-3">
      <div class="col-md-6 co-field"><label for="c-name" data-t="contact.name">Your name</label><input class="co-input" id="c-name" maxlength="150"><span class="app-err" id="c-name-err"></span></div>
      <div class="col-md-6 co-field"><label for="c-email" data-t="auth.email">Email</label><input class="co-input" id="c-email" type="email" dir="ltr"><span class="app-err" id="c-email-err"></span></div>
      <div class="col-12 co-field"><label for="c-topic" data-t="contact.topic">Topic</label>
        <select class="co-input" id="c-topic">
          <option value="company" data-t="topicCompany">Company registration</option><option value="student" data-t="topicStudent">Student question</option>
          <option value="support" data-t="topicSupport">Technical support</option><option value="other" data-t="topicOther">Other</option>
        </select></div>
      <div class="col-12 co-field"><label for="c-msg" data-t="contact.body">Message</label><textarea class="co-input app-textarea" id="c-msg" rows="5" maxlength="2000"></textarea><span class="app-err" id="c-msg-err"></span></div>
    </div>
    <div><button class="co-btn co-btn--primary" type="submit"><svg class="co-ico co-ico--sm" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg><span data-t="contact.send">Send message</span></button></div>
  </form>
  <div class="co-alert co-alert--mint" id="contact-done" role="status" hidden><svg class="co-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12 5 5 9-10"/></svg><div><strong data-t="contact.sent">Thanks. Your message was sent.</strong>
    <button class="co-btn co-btn--soft co-btn--sm mt-2" type="button" onclick="contactAgain()" data-t="sendAnother">Send another message</button></div></div>
</section>
</main>
